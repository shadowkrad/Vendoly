<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vendolyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="vendolyGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="vendolyDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#vendolyBg)"/>
  <rect width="512" height="256" rx="115" fill="url(#vendolyGlow)"/>

  <!-- Icona Shopping Bag Retail Moderna -->
  <g filter="url(#vendolyDrop)" transform="translate(256, 265)">
    <!-- Manici della borsa -->
    <path d="M-55 -40 C-55 -125 55 -125 55 -40" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>

    <!-- Corpo borsa -->
    <path d="M-115 -40 L115 -40 L135 125 C135 140 120 150 105 150 L-105 150 C-120 150 -135 140 -135 125 Z" fill="#ffffff"/>

    <!-- Tag sconto/percentuale o icona cassa al centro -->
    <circle cx="0" cy="55" r="42" fill="#6366f1"/>
    <!-- Simbolo Cartellino / Badge -->
    <path d="M-15 42 L15 68 M-12 68 A5 5 0 1 1 -12 67 M12 43 A5 5 0 1 1 12 42" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

    <!-- Scintilla offerta in alto a destra -->
    <path d="M100 -90 Q100 -65 125 -65 Q100 -65 100 -40 Q100 -65 75 -65 Q100 -65 100 -90 Z" fill="#fef08a"/>
  </g>
</svg>