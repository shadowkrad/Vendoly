# Rigenera ogni lunedi' il database della demo (clienti e appuntamenti di prova con date aggiornate)
# e lo pubblica sul ramo cliente-demo: Vercel ripubblica la demo da solo.
# Si puo' lanciare anche a mano da GitHub: Actions > "Rigenera demo" > Run workflow.
name: Rigenera demo
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rigenera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cliente-demo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Allinea cliente-demo a main
        run: |
          git config user.name "Rigenera demo"
          git config user.email "actions@users.noreply.github.com"
          git merge origin/main --no-edit
      - run: npm ci
      - run: node scripts/crea-demo-db.mjs
      - name: Pubblica la demo aggiornata
        run: |
          git add -f prisma/demo.db
          git diff --cached --quiet && echo "Nessuna modifica" && exit 0
          git commit -m "chore(demo): rigenerato il database demo con date aggiornate"
          git push origin cliente-demo
